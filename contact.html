<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Lesotho Travel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<header class="top">
      <div class="container">
      <a href="home.html" class="logo">Lesotho Travel</a>
      <div class="links">
          <a href="Home.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </ul>
        <button id="darkBtn" class="btn btn-warning btn-sm ms 2">Dark Mode</button>

      </div>
    </div>
  </nav>
</header>

<main class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <h2>Contact Us</h2>

      <form id="contactForm" class="white-box">
        <p id="welcomeMsg"></p>
        <label>Full Name</label>
        <input type="text" id="contactName" class="form-control" required>
        <label class="mt-2">Email</label>
        <input type="email" id="contactEmail" class="form-control" required>
        <label class="mt-2">Phone</label>
        <input type="tel" id="contactPhone" class="form-control" placeholder="+266 ...">
        <label class="mt-2">Subject</label>

        <select class="form-control">
          <option>Booking</option>
          <option>General Question</option>
          <option>Feedback</option>
        </select>

        <label class="mt-2">Message</label>
        <textarea id="contactMessage" class="form-control" rows="4" required></textarea>
        <label class="mt-2">Gender</label>
        <br><input type="radio" name="gender"> Male <input type="radio" name="gender"> Female
        <br><button type="submit" class="btn btn-custom mt-3">Send Message</button>
      </form>
    </div>

    <div class="col-md-6">
      <div class="white-box">
        <h3>Find Us</h3>
        <p>Maseru, Lesotho<br>Phone: +266 2231 0000<br>Email: info@lesothotravel.ls</p>
      <iframe src="https://www.google.com/maps?q=Maseru,Lesotho&output=embed" class="map-frame"></iframe>
    </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>&copy; 2026 Lesotho Travel</p>
</footer>
<script>
  if(localStorage.getItem('dark')=== 'on'){
    document.body.classList.add('dark-mode');
  }

  document.getElementById('darkBtn').onclick = function(){
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      localStorage.setItem('dark','on');
    }else{
      localStorage.setItem('dark off');
    }
  };
</script>
</body>
</html>
