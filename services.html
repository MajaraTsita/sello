
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services - Lesotho Travel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">
    <div class="container">

        <a href="index.html" class="logo">Lesotho Travel</a>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>

            <button id="darkBtn" class="btn btn-warning btn-sm ms-2">
                Dark Mode
            </button>
        </div>

    </div>
</header>

<main class="container mt-4">

    <h2>Our Services & Tours</h2>

    <div class="row">

        <div class="col-md-4 search-item">
            <div class="card p-3">
                <h4>Maletsunyane Tour</h4>
                <p>Waterfall & Abseiling</p>
                <p><strong>M500 / person</strong></p>
                <button type="button" class="btn-custom" onclick="selectService(500)">
                    Book Now
                </button>
            </div>
        </div>

        <div class="col-md-4 search-item">
            <div class="card p-3">
                <h4>Katse Dam Tour</h4>
                <p>Dam wall & Boat ride</p>
                <p><strong>M800 / person</strong></p>
                <button type="button" class="btn-custom" onclick="selectService(800)">
                    Book Now
                </button>
            </div>
        </div>

        <div class="col-md-4 search-item">
            <div class="card p-3">
                <h4>Thaba-Bosiu Tour</h4>
                <p>History & Culture</p>
                <p><strong>M350 / person</strong></p>
                <button type="button" class="btn-custom" onclick="selectService(350)">
                    Book Now
                </button>
            </div>
        </div>

    </div>

    <h3 class="mt-4">Booking Form & Calculator</h3>

    <form id="bookingForm" class="white-box">

        <div id="bookingError" class="text-danger"></div>
        <div id="bookingSuccess" class="text-success"></div>

        <label>Full Name</label>
        <input type="text" id="bookingName" class="form-control" required>

        <label class="mt-2">Email</label>
        <input type="email" id="bookingEmail" class="form-control" required>

        <label class="mt-2">Date</label>
        <input type="date" id="bookingDate" class="form-control" required>

        <label class="mt-2">Service</label>

        <select id="service" class="form-control">
            <option value="500">Maletsunyane - M500</option>
            <option value="800">Katse Dam - M800</option>
            <option value="350">Thaba-Bosiu - M350</option>
        </select>

        <label class="mt-2">Number of People</label>
        <input type="number" id="people" class="form-control" min="1" value="1" required>

        <h4 id="totalCost" class="mt-3">Total: M500</h4>

        <button type="submit" class="btn btn-custom">
            Confirm Booking
        </button>

    </form>

</main>

<footer class="site-footer">
    <p>&copy; 2026 Lesotho Travel</p>
</footer>

<script>

// Dark Mode
if (localStorage.getItem('dark') === 'on') {
    document.body.classList.add('dark-mode');
}

document.getElementById('darkBtn').onclick = function() {

    document.body.classList.toggle('dark-mode');

    if (document.body.classList.contains('dark-mode')) {
        localStorage.setItem('dark', 'on');
    } else {
        localStorage.setItem('dark', 'off');
    }

};


// Booking Calculator
const service = document.getElementById('service');
const people = document.getElementById('people');
const totalCost = document.getElementById('totalCost');

function calculateTotal() {

    let price = Number(service.value);
    let numberOfPeople = Number(people.value);

    if (numberOfPeople < 1 || !Number.isInteger(numberOfPeople)) {
        totalCost.textContent = 'Please enter a valid number of people';
        return;
    }

    let total = price * numberOfPeople;

    totalCost.textContent = 'Total: M' + total;

}

service.addEventListener('change', calculateTotal);
people.addEventListener('input', calculateTotal);


// Select Tour
function selectService(price) {

    service.value = price;
    calculateTotal();

    document.getElementById('bookingForm').scrollIntoView({
        behavior: 'smooth'
    });

}


// Booking Form
document.getElementById('bookingForm').addEventListener('submit', function(event) {

    event.preventDefault();

    const name = document.getElementById('bookingName').value.trim();
    const email = document.getElementById('bookingEmail').value.trim();
    const date = document.getElementById('bookingDate').value;
    const numberOfPeople = Number(people.value);

    const error = document.getElementById('bookingError');
    const success = document.getElementById('bookingSuccess');

    error.textContent = '';
    success.textContent = '';

    if (!name || !email || !date || numberOfPeople < 1 ||
        !Number.isInteger(numberOfPeople)) {

        error.textContent = 'Please complete all fields correctly.';
        return;
    }

    const price = Number(service.value);
    const total = price * numberOfPeople;

    success.textContent =
        'Booking details received! Name: ' + name +
        '. Total cost: M' + total +
        '. Please note that this is a demonstration; no booking has been sent to a server.';

});

</script>

</body>
</html>
