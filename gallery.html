
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery - Lesotho Travel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">
    <div class="container">

        <a href="index.html" class="logo">Lesotho Travel</a>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>

            <button id="darkBtn" class="btn btn-warning btn-sm ms-2">
                Dark Mode
            </button>
        </div>

    </div>
</header>

<main class="container mt-4">

    <h2>Photo Gallery</h2>

    <div class="mb-3">
        <button class="btn-custom">Waterfalls</button>
        <button class="btn-custom">Mountains</button>
        <button class="btn-custom">Culture</button>
    </div>

    <div class="row">

        <div class="col-md-4 mb-3">
            <img src="Maletsunyane.jpg" class="gallery-img" alt="Maletsunyane Falls">
            <p>Maletsunyane Falls</p>
        </div>

        <div class="col-md-4 mb-3">
            <img src="katse.jfif" class="gallery-img" alt="Katse Dam">
            <p>Katse Dam</p>
        </div>

        <div class="col-md-4 mb-3">
            <img src="thaba.jpeg" class="gallery-img" alt="Thaba-Bosiu">
            <p>Thaba-Bosiu</p>
        </div>

        <div class="col-md-4 mb-3">
            <img src="th (1).jpeg" class="gallery-img" alt="Lesotho mountains">
            <p>Maluti Mountains</p>
        </div>

        <div class="col-md-4 mb-3">
            <img src="th (4).jpeg" class="gallery-img" alt="Basotho blanket">
            <p>Basotho Blanket</p>
        </div>

        <div class="col-md-4 mb-3">
            <img src="th (3).jpeg" class="gallery-img" alt="Waterfall">
            <p>Waterfall Hike</p>
        </div>

    </div>

</main>

<footer class="site-footer">
    <p>&copy; 2026 Lesotho Travel</p>
</footer>

<script>

    // Dark Mode
    if (localStorage.getItem('dark') === 'on') {
        document.body.classList.add('dark-mode');
    }

    document.getElementById('darkBtn').onclick = function() {

        document.body.classList.toggle('dark-mode');

        if (document.body.classList.contains('dark-mode')) {
            localStorage.setItem('dark', 'on');
        } else {
            localStorage.setItem('dark', 'off');
        }

    };

</script>

</body>
</html>
